<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Tower Defense</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-viewport">
    <div id="game-container">
      <canvas id="game-canvas" width="1200" height="750"></canvas>
      <button id="skip-wave-btn" class="hidden">▶</button>
      <div id="upgrade-panel" class="hidden"></div>
      <div id="start-menu" class="hidden">
        <div id="start-menu-modal">
          <div id="start-menu-title">Elige nivel</div>
          <div id="start-menu-levels">
            <button class="start-level-btn" data-level="1">
              <span class="start-level-name">Nivel 1</span>
              <span class="start-level-subtitle">Campo</span>
            </button>
            <button class="start-level-btn" data-level="2">
              <span class="start-level-name">Nivel 2</span>
              <span class="start-level-subtitle">Ciudad</span>
            </button>
          </div>
        </div>
      </div>
      <div id="gameend-overlay" class="hidden">
        <div id="gameend-modal">
          <div id="gameend-title"></div>
          <table id="gameend-breakdown"></table>
          <div id="gameend-total"></div>
          <div id="gameend-save-row">
            <input id="gameend-name-input" type="text" maxlength="16" placeholder="TU NOMBRE" autocomplete="off" />
            <button id="gameend-save-btn">Guardar puntuación</button>
          </div>
          <div id="gameend-save-status"></div>
          <div id="gameend-ranking-title">Ranking</div>
          <ol id="gameend-ranking"></ol>
          <button id="gameend-close-btn">Jugar de nuevo</button>
        </div>
      </div>
    </div>
    <!-- Outside #game-container (which has the JS-driven transform:scale)
         so position:fixed here is relative to the real viewport, not the
         scaled game -- lets main.js's resizeGame() park this in the black
         letterbox margin on a wide window instead of covering the map,
         per user request, falling back to overlapping the top of the map
         (like the old layout) when the window's too narrow for a margin. -->
    <div id="build-menu"></div>
    <div id="top-controls">
      <button id="mute-btn" title="Silenciar sonido">🔊</button>
      <button id="pause-btn" title="Pausar">⏸</button>
      <button id="reset-btn" title="Reiniciar partida">⟲</button>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
