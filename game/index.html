<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Tower Defense</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-viewport">
    <div id="game-container">
      <canvas id="game-canvas" width="1200" height="750"></canvas>
      <button id="skip-wave-btn" class="hidden">▶</button>
      <div id="top-controls">
        <button id="mute-btn" title="Silenciar sonido">🔊</button>
        <button id="pause-btn" title="Pausar">⏸</button>
        <button id="reset-btn" title="Reiniciar partida">⟲</button>
      </div>
      <div id="build-menu"></div>
      <div id="upgrade-panel" class="hidden"></div>
      <div id="gameend-overlay" class="hidden">
        <div id="gameend-modal">
          <div id="gameend-title"></div>
          <table id="gameend-breakdown"></table>
          <div id="gameend-total"></div>
          <div id="gameend-save-row">
            <input id="gameend-name-input" type="text" maxlength="16" placeholder="TU NOMBRE" autocomplete="off" />
            <button id="gameend-save-btn">Guardar puntuación</button>
          </div>
          <div id="gameend-save-status"></div>
          <div id="gameend-ranking-title">Ranking</div>
          <ol id="gameend-ranking"></ol>
          <button id="gameend-close-btn">Jugar de nuevo</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
